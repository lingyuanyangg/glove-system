<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 125" width="880" height="250"><rect width="440" height="125" fill="#383838"/><text x="10" y="20.32" font-family="Arial, sans-serif" font-size="11" fill="#d4d4d4">LEFT HAND  /  CALIBRATION</text><text x="10" y="40.84" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">Hold each pose still for 0.3 seconds before capturing.</text><rect x="10" y="51" width="130" height="22" fill="#292929" stroke="#727272" stroke-width=".45"/><text x="14" y="67.72" font-family="Arial, sans-serif" font-size="9" fill="#d4d4d4">Open → 0</text><rect x="150" y="51" width="130" height="22" fill="#292929" stroke="#727272" stroke-width=".45"/><text x="154" y="67.72" font-family="Arial, sans-serif" font-size="9" fill="#d4d4d4">Fist → 0.9</text><rect x="290" y="51" width="130" height="22" fill="#292929" stroke="#727272" stroke-width=".45"/><text x="294" y="67.72" font-family="Arial, sans-serif" font-size="9" fill="#d4d4d4">Reset</text><text x="10" y="92.58" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">Default range. Capture Open and Fist.</text><text x="10" y="113.84" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">Fist = 0.900; extra bend may rise to 1.000.</text></svg>