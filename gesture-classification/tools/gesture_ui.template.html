<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glove Gesture</title>
<style>
:root{--bg:#292929;--panel:#343434;--field:#1e1e1e;--ink:#dedede;--muted:#a0a0a0;--accent:#ffb84b;--line:#575757}*{box-sizing:border-box}html,body{margin:0;width:100%;height:142px;overflow:hidden;background:var(--bg);color:var(--ink);font:10px Arial,sans-serif}button,input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px;height:19px}button{cursor:pointer;padding:1px 6px;white-space:nowrap}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}button.on{background:var(--accent);color:#222;border-color:var(--accent)}input{padding:1px 3px;min-width:0}select{padding:0 2px;min-width:0}header{height:26px;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--line)}strong{font-size:11px;letter-spacing:.8px;width:119px;flex-shrink:0}#mode{width:73px}#model{width:127px}#name{width:90px}#engine{font-size:8px;letter-spacing:.3px;color:var(--muted);width:79px;flex-shrink:0}.spacer{flex:1}.toolbar{height:25px;display:flex;align-items:center;gap:6px;padding:0 6px}.setting{display:flex;align-items:center;gap:3px;color:var(--muted);white-space:nowrap}.setting input{width:42px;height:17px}.setting.wide input{width:48px}#note{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:0 6px}.card{height:86px;background:var(--panel);border:1px solid var(--line);padding:3px 4px;position:relative}.card.active{border-color:var(--accent);color:var(--accent)}.card.candidate{background:var(--field)}.card.recording{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.card.disabled{opacity:.45}.title{display:flex;align-items:center;gap:3px;height:12px}.title input{accent-color:var(--accent);margin:0;width:10px;height:10px}.title b{font-size:10px;font-weight:normal}.count{margin-left:auto;color:var(--muted);font-size:8px}.art{height:46px;display:flex;justify-content:center;align-items:center;gap:6px}.art svg{height:44px;width:40px;display:block}.art .left{transform:scaleX(-1)}.art small{font-size:7px;color:var(--muted)}.controls{display:flex;align-items:center;gap:3px;height:18px}.controls button{height:17px;padding:0 4px;font-size:9px}.controls select{height:17px;flex:1;width:58px;font-size:9px}.card .target{display:none}.pulse-dot{width:4px;height:4px;background:var(--accent);border-radius:50%;display:inline-block;margin-left:3px}.othercount{color:var(--muted);font-size:8px}#train{width:48px}#other{width:63px}#clearOther{width:18px;padding:0}#run{width:35px}#stop{width:35px}#modelDelete{padding:0;width:18px}#help{padding:0;width:18px}
</style></head><body>
<header><strong>GLOVE GESTURE</strong><select id="mode" aria-label="Hand mode"><option value="left">Left hand</option><option value="right">Right hand</option><option value="both">Both hands</option></select><button id="run">Run</button><button id="stop">Stop</button><span id="engine">FLUCOMA OFFLINE</span><select id="model" aria-label="Saved model"><option value="">Saved models…</option></select><button id="loadModel">Load</button><input id="name" placeholder="Model name" aria-label="New model name" maxlength="80"><button id="saveModel">Save</button><button id="importModel">Import</button><button id="exportModel">Export</button><button id="modelDelete" title="Remove selected saved model">×</button><span class="spacer"></span><button id="help" title="Open the gesture guide">?</button></header>
<div class="toolbar"><button id="train">Train</button><button id="other" title="Record relaxed poses and transitions for two seconds">+ Other</button><span id="otherCount" class="othercount">0</span><button id="clearOther" title="Clear Other examples">×</button><label class="setting">Hold <input id="hold" type="number" min="40" max="1000" step="10" title="Stable recognition time in milliseconds"></label><label class="setting">Gap <input id="cooldown" type="number" min="0" max="3000" step="10" title="Minimum time between triggers in milliseconds"></label><label class="setting">Pulse <input id="pulse" type="number" min="40" max="1000" step="10" title="Pulse button duration in milliseconds"></label><label class="setting">Radius <input id="radius" type="number" min=".01" max="1" step=".01" title="Maximum RMS finger distance to a recorded example; not confidence"></label><label class="setting wide">Epochs <input id="epochs" type="number" min="50" max="3000" step="50"></label><span id="note" title="Record each gesture and Other, then Train">Record each gesture and Other, then Train</span></div>
<main id="cards" class="cards"></main>
<script>
'use strict';
var icons=__GESTURE_ICONS__;
var labels=['open','fist','index','v','middle','ok'],names=['Open hand','Fist','Index','V sign','Middle','OK'];
var state=null,packet=null,lastSequence=-1;
function send(op,fields){var m=Object.assign({op:op},fields||{});if(window.max&&window.max.outlet)window.max.outlet('command',encodeURIComponent(JSON.stringify(m)));}
function makeCards(){
 var root=document.getElementById('cards');root.textContent='';
 labels.forEach(function(label,i){var c=document.createElement('section');c.className='card';c.id='card-'+label;
 c.innerHTML='<div class="title"><input type="checkbox" checked aria-label="Enable '+names[i]+'"><b>'+names[i]+'</b><span class="count">0</span></div><div class="art"></div><div class="controls"><button class="record" title="Record this pose for two seconds">+ Rec</button><button class="clear" title="Clear this gesture’s examples">×</button><select aria-label="'+names[i]+' button action"><option value="toggle">Toggle</option><option value="pulse">Pulse</option><option value="gate">Hold</option><option value="on">On</option><option value="off">Off</option></select></div>';
 c.querySelector('input').onchange=function(){send('enabled',{label:label,value:this.checked});};c.querySelector('.record').onclick=function(){send('record',{label:label});};c.querySelector('.clear').onclick=function(){send('clear',{label:label});};c.querySelector('select').onchange=function(){send('action',{index:i,value:this.value});};root.appendChild(c);
 });art('left');
}
function art(mode){labels.forEach(function(label){var target=document.getElementById('card-'+label).querySelector('.art');if(target.dataset.mode===mode)return;target.dataset.mode=mode;
 target.innerHTML=mode==='both'?'<span class="left">'+icons[label]+'</span><small>+</small><span class="right">'+icons[label]+'</span>':'<span class="'+mode+'">'+icons[label]+'</span>';
});}
function rgb(v){return 'rgba('+v.slice(0,3).map(function(x){return Math.round(Math.max(0,Math.min(1,x))*255);}).join(',')+','+Math.max(0,Math.min(1,v[3]))+')';}
function theme(colors){var mapping={live_lcd_bg:'--bg',live_control_text_bg:'--field',live_control_fg:'--ink',live_lcd_control_fg:'--accent',live_lcd_control_fg_zombie:'--muted'};Object.keys(mapping).forEach(function(k){var v=colors[k];if(Array.isArray(v)&&v.length===4&&v.every(function(x){return typeof x==='number'&&Number.isFinite(x);}))document.documentElement.style.setProperty(mapping[k],rgb(v));});var bg=colors.live_lcd_bg,ink=colors.live_control_fg;if(Array.isArray(bg)&&Array.isArray(ink)&&bg.length===4&&ink.length===4&&bg.concat(ink).every(Number.isFinite)){document.documentElement.style.setProperty('--panel',rgb(bg.map(function(x,i){return i===3?1:x*.92+ink[i]*.08;})));document.documentElement.style.setProperty('--line',rgb(bg.map(function(x,i){return i===3?1:x*.68+ink[i]*.32;})));}}
function setValue(id,v){var e=document.getElementById(id);if(document.activeElement!==e)e.value=String(v);}
function render(s){
 state=s;theme(s.colors||{});art(s.mode);setValue('mode',s.mode);['hold','cooldown','radius','epochs','pulse'].forEach(function(k){setValue(k,s[k]);});
 document.getElementById('engine').textContent=s.training?'FLUCOMA TRAINING':s.engineReady?(s.running?'FLUCOMA RUNNING':'FLUCOMA READY'):'FLUCOMA OFFLINE';
 document.getElementById('note').textContent=s.note;document.getElementById('note').title=s.note;document.getElementById('otherCount').textContent=s.counts[6];
 document.getElementById('run').className=s.running?'on':'';document.getElementById('run').disabled=!s.ready||!s.engineReady||!s.trained||s.training||!!s.recording;
 document.getElementById('train').textContent=s.training?'Cancel':'Train';document.getElementById('train').disabled=!s.ready||!s.engineReady||!!s.recording;
 document.getElementById('other').className=s.recording==='other'?'on':'';document.getElementById('other').disabled=!s.ready||s.training||!!s.recording;
 document.getElementById('clearOther').disabled=!s.ready||s.training||!!s.recording;
 var model=document.getElementById('model'),signature=JSON.stringify(s.models);if(model.dataset.signature!==signature){model.dataset.signature=signature;model.textContent='';var empty=document.createElement('option');empty.value='';empty.textContent='Saved models…';model.appendChild(empty);s.models.forEach(function(m){var o=document.createElement('option');o.value=m.id;o.textContent=m.name+' · '+m.mode;model.appendChild(o);});}setValue('model',s.modelSelection||'');
 var chosen=s.models.find(function(m){return m.id===s.modelSelection;});document.getElementById('loadModel').disabled=!chosen||chosen.mode!==s.mode||s.training||!!s.recording;
 document.getElementById('exportModel').disabled=!chosen;document.getElementById('modelDelete').disabled=!chosen;document.getElementById('saveModel').disabled=!s.ready||!s.trained||s.training||!!s.recording;
 labels.forEach(function(label,i){var c=document.getElementById('card-'+label);c.className='card'+(s.confirmed===label?' active':s.candidate===label?' candidate':'')+(s.recording===label?' recording':'')+(!s.enabled[i]?' disabled':'');
 c.querySelector('.count').textContent=s.counts[i];c.querySelector('input').checked=s.enabled[i];c.querySelector('input').disabled=s.training||!!s.recording;c.querySelector('.record').disabled=!s.ready||s.training||!!s.recording||!s.enabled[i];c.querySelector('.clear').disabled=!s.ready||s.training||!!s.recording;c.querySelector('select').value=s.actions[i];c.title=(s.targets[i]?'Mapped: '+s.targets[i]:'Use the native Map button below')+(label==='ok'?' · OK is learned from finger bend; contact is not measured':'');
 });
}
function statepacket(seq,index,total,part){
 seq=Number(seq);index=Number(index);total=Number(total);
 if(!Number.isInteger(seq)||!Number.isInteger(index)||!Number.isInteger(total)||seq<=lastSequence||index<0||index>=total||total<1||total>2048||typeof part!=='string')return;
 if(!packet||seq>packet.seq)packet={seq:seq,total:total,parts:new Array(total),seen:0};if(seq!==packet.seq||total!==packet.total)return;
 if(packet.parts[index]!==undefined)return;packet.parts[index]=part;packet.seen++;if(packet.seen!==total)return;
 try{var s=JSON.parse(decodeURIComponent(packet.parts.join('')));if(!s||['left','right','both'].indexOf(s.mode)<0||!Array.isArray(s.counts)||s.counts.length!==7||!Array.isArray(s.enabled)||s.enabled.length!==6||!Array.isArray(s.actions)||s.actions.length!==6||!Array.isArray(s.models)||!Array.isArray(s.targets)||s.targets.length!==6)throw Error('Malformed state');render(s);lastSequence=seq;}catch(e){}packet=null;
}
makeCards();
document.getElementById('mode').onchange=function(){send('mode',{value:this.value});};document.getElementById('run').onclick=function(){send('run');};document.getElementById('stop').onclick=function(){send('stop');};document.getElementById('train').onclick=function(){send('train');};document.getElementById('other').onclick=function(){send('record',{label:'other'});};document.getElementById('clearOther').onclick=function(){send('clear',{label:'other'});};
['hold','cooldown','radius','epochs','pulse'].forEach(function(k){document.getElementById(k).onchange=function(){send('setting',{key:k,value:Number(this.value)});};});
document.getElementById('model').onchange=function(){if(this.value)send('pickModel',{id:this.value});};document.getElementById('loadModel').onclick=function(){send('loadModel',{id:document.getElementById('model').value});};document.getElementById('saveModel').onclick=function(){send('saveModel',{name:document.getElementById('name').value});};document.getElementById('importModel').onclick=function(){send('import');};document.getElementById('exportModel').onclick=function(){send('export',{id:document.getElementById('model').value});};document.getElementById('modelDelete').onclick=function(){send('deleteModel',{id:document.getElementById('model').value});};document.getElementById('help').onclick=function(){send('help');};
if(window.max&&window.max.bindInlet){window.max.bindInlet('statepacket',statepacket);send('hello');}else{document.getElementById('run').disabled=true;document.getElementById('train').disabled=true;}
</script></body></html>
