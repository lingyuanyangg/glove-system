<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Glove Gesture — Mapping</title><style>
:root{--bg:#292929;--panel:#343434;--field:#1e1e1e;--ink:#ddd;--muted:#a0a0a0;--accent:#ffb84b;--line:#575757}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px Arial}header{position:sticky;top:0;background:var(--bg);height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}strong{font-size:13px;letter-spacing:.8px;margin-right:auto}button,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px;height:24px}button{cursor:pointer;padding:2px 9px}button:disabled{opacity:.4}button.armed{color:var(--accent);border-color:var(--accent)}label{font-size:11px;color:var(--muted)}input{accent-color:var(--accent)}.hint{color:var(--muted);font-size:11px;padding:10px 14px;line-height:16px}.row{display:grid;grid-template-columns:68px minmax(145px,1fr) 155px 67px 26px 88px;align-items:center;gap:8px;min-height:48px;padding:5px 14px;border-bottom:1px solid var(--line)}.art{display:flex;justify-content:center;align-items:center;gap:3px}.art svg{height:32px;width:29px}.left{transform:scaleX(-1)}.title{font-size:11px}.meta{font-size:10px;color:var(--muted);margin-top:3px}.target{font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--muted)}.row.active{background:var(--panel);border-left:2px solid var(--accent);padding-left:12px}.empty{padding:20px;color:var(--muted)}#note{padding:12px 14px;color:var(--muted);font-size:11px}
</style></head><body><header><strong>GESTURE MAPPING</strong><select id="view" aria-label="Mapping hand mode"><option value="left">Left hand</option><option value="right">Right hand</option><option value="both">Both hands</option></select><label><input id="all" type="checkbox">Show all combinations</label><button id="stop">Stop</button></header><div class="hint">Map → click a two-state device button in Live. Left, Right and each paired pose have independent mappings.<br>Both: the left/right selections are one combined trigger. Pulse/Hold release on Stop or missing input.</div><main id="rows"></main><div id="note"></div>
<script>
__COMMON_JS__
var state=null,viewMode=null,rowShape='',rowNodes={};function $(id){return document.getElementById(id);}var send=GestureUI.send;
function render(s){state=s;GestureUI.theme(s.colors||{});if(!viewMode)viewMode=s.mode;$('view').value=viewMode;var mode=viewMode,list=GestureUI.keys(mode),counts=s.allCounts[mode],enabled=s.allEnabled[mode];var visible=list.filter(function(key,i){return mode!=='both'||$('all').checked||counts[i]>0||enabled[i]||s.targets[GestureUI.slot(mode,key)];});var shape=mode+'|'+visible.join('|');
 if(shape!==rowShape){rowShape=shape;rowNodes={};$('rows').textContent='';if(!visible.length){var e=document.createElement('div');e.className='empty';e.textContent='Record a left/right combination in the main device, or enable Show all combinations.';$('rows').appendChild(e);}visible.forEach(function(key){var slot=GestureUI.slot(mode,key),row=document.createElement('section');row.className='row';row.innerHTML='<div class="art">'+GestureUI.image(key,mode)+'</div><div><div class="title"></div><div class="meta"></div></div><div class="target"></div><button class="map">Map</button><button class="unmap" title="Unmap">×</button><select class="action"><option value="toggle">Toggle</option><option value="pulse">Pulse</option><option value="gate">Hold</option><option value="on">On</option><option value="off">Off</option></select>';row.querySelector('.title').textContent=GestureUI.title(key,mode);row.querySelector('.map').onclick=function(){send('map',{index:slot});};row.querySelector('.unmap').onclick=function(){send('unmap',{index:slot});};row.querySelector('.action').onchange=function(){send('action',{index:slot,value:this.value});};rowNodes[key]=row;$('rows').appendChild(row);});}
 visible.forEach(function(key){var row=rowNodes[key],slot=GestureUI.slot(mode,key),i=list.indexOf(key);row.className='row'+(s.running&&s.mode===mode&&s.confirmed===key?' active':'');row.querySelector('.target').textContent=s.targets[slot]||'Unmapped';row.querySelector('.target').title=s.targets[slot]||'Click Map, then a Live device button';row.querySelector('.meta').textContent=counts[i]+' samples'+(enabled[i]?' · training enabled':'');row.querySelector('.map').className=s.learning===slot?'map armed':'map';row.querySelector('.map').textContent=s.learning===slot?'Click Live':'Map';row.querySelector('.map').disabled=!s.ready;row.querySelector('.action').value=s.actions[slot];row.querySelector('.action').disabled=!s.ready;row.querySelector('.unmap').disabled=!s.ready;});$('note').textContent=s.note;
}
var statepacket=GestureUI.receiver(render);$('view').onchange=function(){viewMode=this.value;rowShape='';if(state)render(state);};$('all').onchange=function(){rowShape='';if(state)render(state);};$('stop').onclick=function(){send('stop');};if(window.max&&window.max.bindInlet){window.max.bindInlet('statepacket',statepacket);send('hello',{surface:'mapping'});}
</script></body></html>
