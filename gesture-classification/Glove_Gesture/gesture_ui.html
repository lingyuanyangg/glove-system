<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Glove Gesture</title><style>
:root{--bg:#292929;--panel:#343434;--field:#1e1e1e;--ink:#dedede;--muted:#a0a0a0;--accent:#ffb84b;--line:#575757}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:169px;overflow:hidden;background:var(--bg);color:var(--ink);font:10px Arial}button,input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px;height:20px}button{padding:1px 6px;cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){border-color:var(--accent)}button.on{background:var(--accent);color:#222}input{padding:1px 3px}select{padding:0 3px}.spacer{flex:1}header{height:27px;display:flex;align-items:center;gap:4px;padding:0 7px;border-bottom:1px solid var(--line)}strong{font-size:11px;letter-spacing:.6px;width:113px;flex-shrink:0}#mode{width:79px}#engine{width:97px;font-size:8px;color:var(--muted)}#model{width:139px}#help{width:20px;padding:0}.body{height:137px;padding:7px;display:grid;grid-template-columns:166px 320px 1fr;gap:9px}.pose{height:126px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;flex-direction:column;padding:5px}.pose.live{border-color:var(--accent)}#poseArt{height:90px;display:flex;align-items:center;justify-content:center;gap:6px}.hand svg{height:88px;width:80px}.hand.left{transform:scaleX(-1)}.pose.both #poseArt{height:76px}.pose.both .hand svg{height:76px;width:65px}.plus{color:var(--muted)}.unknown{font-size:44px;color:var(--muted)}#poseTitle{font-size:10px;line-height:12px;text-align:center}#poseStatus{font-size:8px;margin-top:3px;color:var(--muted)}.train{display:flex;flex-direction:column;gap:6px}label{color:var(--muted)}.selectors{display:flex;gap:8px}.selectors label{display:flex;flex:1;flex-direction:column;gap:3px}.selectors select{width:100%}.row{display:flex;align-items:center;gap:5px}.sub{color:var(--muted);font-size:9px}.include{display:flex;align-items:center;gap:3px}.include input{width:11px;height:11px;margin:0;accent-color:var(--accent)}#count{margin-left:auto;color:var(--muted)}#name{width:99px}#note{font-size:9px;color:var(--muted);line-height:13px;max-height:28px;overflow:hidden;margin-top:auto}.settings{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;align-content:start}.settings label{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:9px}.settings input{width:49px;height:18px}#confirmed{grid-column:1/3;color:var(--muted);font-size:9px;line-height:13px}#modelDelete{width:18px;padding:0}#otherCount{font-size:9px;color:var(--muted)}
</style></head><body><header><strong>GLOVE GESTURE</strong><select id="mode" aria-label="Hand mode"><option value="left">Left hand</option><option value="right">Right hand</option><option value="both">Both hands</option></select><button id="run">Run</button><button id="stop">Stop</button><button id="mapping">Mapping</button><span id="engine">FLUCOMA OFFLINE</span><select id="model" aria-label="Saved model"><option value="">Saved models…</option></select><button id="loadModel">Load</button><span class="spacer"></span><button id="help">?</button></header>
<div class="body"><section id="pose" class="pose"><div id="poseArt"></div><div id="poseTitle">Open hand</div><div id="poseStatus">TRAINING POSE</div></section><section class="train"><div class="selectors"><label id="leftLabel"><span id="leftCaption">Gesture</span><select id="leftGesture" aria-label="Left hand training gesture"></select></label><label id="rightLabel" hidden><span id="rightCaption">Right hand</span><select id="rightGesture" aria-label="Right hand training gesture"></select></label></div><div class="row"><label class="include"><input id="enabled" type="checkbox">Include in training</label><span id="count">0 / 400</span><button id="clear" title="Clear examples for the selected gesture">Clear</button></div><div class="row"><button id="record">Record 2s</button><button id="other">Other 2s</button><span id="otherCount">0</span><button id="clearOther" title="Clear Other examples">×</button><span class="spacer"></span><button id="train">Train</button></div><div class="row"><input id="name" placeholder="Model name" maxlength="80"><button id="saveModel">Save</button><button id="importModel">Import</button><button id="exportModel">Export</button><button id="modelDelete" title="Remove selected saved model">×</button></div><div id="note">Select a gesture, record examples and Other, then Train.</div></section><section class="settings"><label>Hold ms <input id="hold" type="number" min="40" max="1000" step="10"></label><label>Gap ms <input id="cooldown" type="number" min="0" max="3000" step="10"></label><label>Pulse ms <input id="pulse" type="number" min="40" max="1000" step="10"></label><label>Radius <input id="radius" type="number" min=".01" max="1" step=".01"></label><label>Epochs <input id="epochs" type="number" min="50" max="3000" step="50"></label><span></span><div id="confirmed">One pose at a time.<br>Both: choose each hand, record as one combination.</div></section></div>
<script>
var GestureUI=(function(){
 var icons={"open": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"open hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M39 124 L39 108 C31 103 21 88 12 74 C7 66 7 61 12 59 C17 57 22 64 32 75 L32 32 C32 20 42 19 44 30 L47 65 L47 17 C47 6 58 6 60 17 L62 63 L65 27 C66 15 77 17 78 28 L79 67 L87 43 C91 33 101 36 99 47 L96 85 C95 102 88 111 83 117 L83 124\"/><path d=\"M33 78 C45 83 48 91 46 100 M52 84 C62 87 71 87 80 83 M43 113 L80 113\"/></g></svg>", "fist": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"fist hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M37 124 L37 109 C28 104 19 96 18 83 L19 65 C20 55 30 55 35 60 C37 50 49 48 56 56 C61 48 72 51 76 59 C84 54 94 61 94 69 L96 89 C96 103 89 112 83 117 L83 124\"/><path d=\"M35 60 L35 76 Q39 82 45 76 L46 60 M56 56 L57 74 Q62 80 67 74 L67 58 M76 59 L79 76 Q85 82 89 75 L89 65\"/><path d=\"M21 87 C28 76 41 73 48 78 L66 87 C73 92 66 101 59 98 L40 91 M40 91 L35 102 M41 115 L81 115\"/></g></svg>", "index": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"index hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M39 124 L39 108 C30 103 22 93 20 83 L19 69 C19 61 29 60 34 69 L34 26 C34 14 46 13 48 26 L50 64 C55 54 66 54 70 64 C78 59 87 63 87 72 C95 69 100 78 97 91 C95 104 88 112 82 117 L82 124\"/><path d=\"M51 65 L53 81 Q59 87 65 80 L66 66 M72 67 L75 83 Q81 88 86 81 M21 84 C29 77 37 78 43 85 L57 93 Q61 100 53 102 L37 94 M43 114 L80 114\"/></g></svg>", "v": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"v hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M39 124 L39 108 C30 103 22 94 20 82 L18 71 C17 61 28 59 33 69 L26 25 C24 14 35 11 39 22 L54 62 L66 18 C69 6 81 9 79 21 L68 68 C74 61 84 64 87 74 C94 70 101 79 97 92 C94 104 87 112 82 117 L82 124\"/><path d=\"M69 70 L72 85 Q79 90 85 82 M21 84 C29 76 39 79 45 86 L58 94 Q63 101 53 103 L37 95 M43 114 L80 114\"/></g></svg>", "middle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"middle hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M39 124 L39 108 C29 103 22 94 20 82 L18 70 C17 61 27 59 33 66 C35 55 46 55 51 63 L50 18 C50 6 62 6 64 18 L67 65 C73 56 83 59 87 70 C95 67 101 76 97 91 C95 104 87 112 82 117 L82 124\"/><path d=\"M34 68 L36 80 Q43 86 48 78 M69 68 L72 83 Q79 88 85 80 M21 85 C29 77 38 79 44 85 L59 94 Q63 101 54 103 L38 95 M43 114 L80 114\"/></g></svg>", "ok": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 132\" role=\"img\" aria-label=\"ok hand gesture\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M40 124 L40 108 C32 105 24 99 20 89 C11 86 9 76 14 67 C20 58 30 57 37 61 L45 67 L45 18 C45 7 57 7 59 18 L61 62 L65 28 C66 17 77 18 78 29 L79 66 L88 43 C91 34 101 37 99 47 L96 86 C95 104 87 112 82 117 L82 124\"/><path d=\"M45 67 C51 71 52 81 47 89 C40 98 26 96 20 89 M21 73 C26 68 34 70 39 75 C44 80 39 87 33 88 C27 89 20 84 21 78 Z\"/><path d=\"M59 82 C66 85 74 85 82 80 M44 114 L80 114\"/></g></svg>"},labels=['open','fist','index','v','middle','ok'],names=['Open hand','Fist','Index','V sign','Middle','OK'];
 function keys(mode){var a=[];if(mode==='both')labels.forEach(function(l){labels.forEach(function(r){a.push(l+'__'+r);});});else a=labels.slice();return a;}
 function parts(key){return key.indexOf('__')>=0?key.split('__'):[key,key];}
 function title(key,mode){if(key==='other'||!key)return 'Other / transition';var p=parts(key);return mode==='both'?'L '+names[labels.indexOf(p[0])]+' + R '+names[labels.indexOf(p[1])]:names[labels.indexOf(key)];}
 function slot(mode,key){return (mode==='left'?0:mode==='right'?6:12)+keys(mode).indexOf(key);}
 function image(key,mode){if(!key||key==='other')return '<span class="unknown">?</span>';var p=parts(key);return mode==='both'?'<span class="hand left">'+icons[p[0]]+'</span><span class="plus">+</span><span class="hand right">'+icons[p[1]]+'</span>':'<span class="hand '+mode+'">'+icons[key]+'</span>';}
 function send(op,fields){var m=Object.assign({op:op},fields||{});if(window.max&&window.max.outlet)window.max.outlet('command',encodeURIComponent(JSON.stringify(m)));}
 function rgb(v){return 'rgba('+v.slice(0,3).map(function(x){return Math.round(Math.max(0,Math.min(1,x))*255);}).join(',')+','+Math.max(0,Math.min(1,v[3]))+')';}
 function theme(c){var map={live_lcd_bg:'--bg',live_control_text_bg:'--field',live_control_fg:'--ink',live_lcd_control_fg:'--accent',live_lcd_control_fg_zombie:'--muted'};Object.keys(map).forEach(function(k){var v=c[k];if(Array.isArray(v)&&v.length===4&&v.every(Number.isFinite))document.documentElement.style.setProperty(map[k],rgb(v));});var bg=c.live_lcd_bg,ink=c.live_control_fg;if(Array.isArray(bg)&&Array.isArray(ink)&&bg.length===4&&ink.length===4&&bg.concat(ink).every(Number.isFinite)){document.documentElement.style.setProperty('--panel',rgb(bg.map(function(v,i){return i===3?1:v*.92+ink[i]*.08;})));document.documentElement.style.setProperty('--line',rgb(bg.map(function(v,i){return i===3?1:v*.68+ink[i]*.32;})));}}
 function value(id,v){var e=document.getElementById(id);if(document.activeElement!==e)e.value=String(v);}
 function receiver(render){var last=-1,p=null;return function(seq,index,total,part){seq=Number(seq);index=Number(index);total=Number(total);if(!Number.isInteger(seq)||!Number.isInteger(index)||!Number.isInteger(total)||seq<=last||index<0||index>=total||total<1||total>2048||typeof part!=='string')return;if(!p||seq>p.seq)p={seq:seq,total:total,parts:new Array(total),count:0};if(seq!==p.seq||total!==p.total||p.parts[index]!==undefined)return;p.parts[index]=part;if(++p.count!==total)return;try{var s=JSON.parse(decodeURIComponent(p.parts.join(''))),n=s.mode==='both'?36:6;if(!s||['left','right','both'].indexOf(s.mode)<0||!Array.isArray(s.counts)||s.counts.length!==n+1||!Array.isArray(s.enabled)||s.enabled.length!==n||!Array.isArray(s.actions)||s.actions.length!==48||!Array.isArray(s.targets)||s.targets.length!==48||!Array.isArray(s.models)||!s.selections||labels.indexOf(s.selections.left)<0||labels.indexOf(s.selections.right)<0)throw Error('Malformed state');render(s);last=seq;}catch(e){}p=null;};}
 return {labels:labels,names:names,keys:keys,parts:parts,title:title,slot:slot,image:image,send:send,theme:theme,value:value,receiver:receiver};
}());

var state=null;function $(id){return document.getElementById(id);}var send=GestureUI.send;
['leftGesture','rightGesture'].forEach(function(id){GestureUI.labels.forEach(function(key,i){var o=document.createElement('option');o.value=key;o.textContent=GestureUI.names[i];$(id).appendChild(o);});});
function showPose(key,mode,status){$('poseArt').innerHTML=GestureUI.image(key,mode);$('poseTitle').textContent=GestureUI.title(key,mode);$('poseStatus').textContent=status;$('pose').className='pose'+(mode==='both'?' both':'')+(state&&state.running&&state.confirmed===key&&key!=='other'?' live':'');}
function render(s){state=s;GestureUI.theme(s.colors||{});GestureUI.value('mode',s.mode);var busy=s.training||!!s.recording,locked=busy||s.running;
 $('leftLabel').hidden=s.mode==='right';$('rightLabel').hidden=s.mode==='left';$('leftCaption').textContent=s.mode==='both'?'Left hand':'Gesture';$('rightCaption').textContent=s.mode==='both'?'Right hand':'Gesture';GestureUI.value('leftGesture',s.selections.left);GestureUI.value('rightGesture',s.selections.right);$('leftGesture').disabled=locked;$('rightGesture').disabled=locked;
 var i=s.classKeys.indexOf(s.selectedLabel);$('enabled').checked=s.enabled[i];$('enabled').disabled=locked;$('count').textContent=s.counts[i]+' / 400';$('clear').disabled=busy;$('otherCount').textContent=s.counts[s.counts.length-1];
 $('record').disabled=!s.ready||busy;$('other').disabled=!s.ready||busy;$('clearOther').disabled=busy;$('train').disabled=!s.ready||!s.engineReady||!!s.recording;$('train').textContent=s.training?'Cancel':'Train';$('record').className=s.recording&&s.recording!=='other'?'on':'';$('other').className=s.recording==='other'?'on':'';
 $('run').className=s.running?'on':'';$('run').disabled=!s.ready||!s.engineReady||!s.trained||busy;$('engine').textContent=s.training?'FLUCOMA TRAINING':s.engineReady?(s.running?'FLUCOMA RUNNING':'FLUCOMA READY'):'FLUCOMA OFFLINE';$('note').textContent=s.note;$('note').title=s.note;
 var key=s.running?(s.candidate||'other'):(s.recording||s.selectedLabel),status=s.running?(key==='other'?'OTHER / TRANSITION':s.confirmed===key?'CONFIRMED':'CONFIRMING…'):s.recording?'RECORDING':'TRAINING POSE';showPose(key,s.mode,status);
 $('confirmed').textContent=s.running?'Confirmed: '+(s.confirmed?GestureUI.title(s.confirmed,s.mode):'waiting'):(s.mode==='both'?'Both hands form one combined class.':'Recorded poses are enabled automatically.');
 ['hold','cooldown','radius','epochs','pulse'].forEach(function(k){GestureUI.value(k,s[k]);});var shape=JSON.stringify(s.models);if($('model').dataset.shape!==shape){$('model').dataset.shape=shape;$('model').textContent='';var empty=document.createElement('option');empty.value='';empty.textContent='Saved models…';$('model').appendChild(empty);s.models.forEach(function(m){var o=document.createElement('option');o.value=m.id;o.textContent=m.name+' · '+m.mode;$('model').appendChild(o);});}GestureUI.value('model',s.modelSelection||'');var chosen=s.models.find(function(m){return m.id===s.modelSelection;});$('loadModel').disabled=!chosen||chosen.mode!==s.mode||busy;$('saveModel').disabled=!s.ready||!s.trained||busy;$('exportModel').disabled=!chosen;$('modelDelete').disabled=!chosen;
}
var statepacket=GestureUI.receiver(render);showPose('open','left','TRAINING POSE');
$('mode').onchange=function(){send('mode',{value:this.value});};['left','right'].forEach(function(hand){$(hand+'Gesture').onchange=function(){send('selectGesture',{hand:hand,value:this.value});};});$('enabled').onchange=function(){send('enabled',{value:this.checked});};$('clear').onclick=function(){send('clear');};$('record').onclick=function(){send('record');};$('other').onclick=function(){send('record',{label:'other'});};$('clearOther').onclick=function(){send('clear',{label:'other'});};['run','stop','train','mapping','help'].forEach(function(op){$(op).onclick=function(){send(op);};});['hold','cooldown','radius','epochs','pulse'].forEach(function(k){$(k).onchange=function(){send('setting',{key:k,value:Number(this.value)});};});$('model').onchange=function(){if(this.value)send('pickModel',{id:this.value});};$('loadModel').onclick=function(){send('loadModel',{id:$('model').value});};$('saveModel').onclick=function(){send('saveModel',{name:$('name').value});};$('importModel').onclick=function(){send('import');};$('exportModel').onclick=function(){send('export',{id:$('model').value});};$('modelDelete').onclick=function(){send('deleteModel',{id:$('model').value});};if(window.max&&window.max.bindInlet){window.max.bindInlet('statepacket',statepacket);send('hello');}else{$('run').disabled=true;$('train').disabled=true;}
</script></body></html>
